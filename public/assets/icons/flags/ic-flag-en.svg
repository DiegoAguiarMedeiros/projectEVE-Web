<svg xmlns="http://www.w3.org/2000/svg" width="280" height="200" viewBox="0 0 280 200">
  <!-- Fundo vermelho -->
  <rect width="280" height="200" fill="#b22234"/>
  
  <!-- Faixas brancas -->
  <g fill="#fff">
    <rect y="15" width="280" height="15"/>
    <rect y="45" width="280" height="15"/>
    <rect y="75" width="280" height="15"/>
    <rect y="105" width="280" height="15"/>
    <rect y="135" width="280" height="15"/>
    <rect y="165" width="280" height="15"/>
  </g>
  
  <!-- Campo azul -->
  <rect width="120" height="105" fill="#3c3b6e"/>
  
  <!-- Estrelas no campo azul -->
  <g fill="#fff" transform="translate(10, 10)">
    <!-- Linhas de estrelas -->
    <g>
      <!-- Primeira linha -->
      <circle cx="10" cy="10" r="3"/>
      <circle cx="30" cy="10" r="3"/>
      <circle cx="50" cy="10" r="3"/>
      <circle cx="70" cy="10" r="3"/>
      <circle cx="90" cy="10" r="3"/>
    </g>
    <!-- Segunda linha -->
    <g transform="translate(0, 20)">
      <circle cx="20" cy="10" r="3"/>
      <circle cx="40" cy="10" r="3"/>
      <circle cx="60" cy="10" r="3"/>
      <circle cx="80" cy="10" r="3"/>
    </g>
    <!-- Repetir para todas as linhas -->
    <g transform="translate(0, 40)">
      <circle cx="10" cy="10" r="3"/>
      <circle cx="30" cy="10" r="3"/>
      <circle cx="50" cy="10" r="3"/>
      <circle cx="70" cy="10" r="3"/>
      <circle cx="90" cy="10" r="3"/>
    </g>
    <g transform="translate(0, 60)">
      <circle cx="20" cy="10" r="3"/>
      <circle cx="40" cy="10" r="3"/>
      <circle cx="60" cy="10" r="3"/>
      <circle cx="80" cy="10" r="3"/>
    </g>
    <g transform="translate(0, 80)">
      <circle cx="10" cy="10" r="3"/>
      <circle cx="30" cy="10" r="3"/>
      <circle cx="50" cy="10" r="3"/>
      <circle cx="70" cy="10" r="3"/>
      <circle cx="90" cy="10" r="3"/>
    </g>
  </g>
</svg>
